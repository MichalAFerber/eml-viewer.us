name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  harness:
    name: Headless-Chromium harness (real CSP)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Exits non-zero if package-lock.json has drifted from package.json.
      - name: Install dependencies
        run: npm ci

      # §15 gate: lint MUST run, and MUST fail when there is no lint to run.
      # Body from tgwab-standards templates/ci.yml. Deliberately NOT
      # `npm run lint --if-present`, which exits 0 when the script is absent and
      # reports a passing lint that never ran.
      - name: lint
        run: |
          set -euo pipefail
          if [ -n "${LINT_OPT_OUT:-}" ]; then
            echo "::notice title=lint opted out (§15)::${LINT_OPT_OUT}"
            exit 0
          fi
          if ! node -e "process.exit((require('./package.json').scripts||{}).lint?0:1)"; then
            echo "::error title=no lint script (§15)::CI MUST run lint. Add a \"lint\" script (eslint .) plus templates/eslint.config.js, or declare LINT_OPT_OUT with a reason on the ci job."
            exit 1
          fi
          npm run lint

      # §15 fixture: proves the XSS rule still fires and still reaches the
      # product files named in test/fixtures/xss-lint-covers.json.
      - name: DS §15 XSS lint fixture
        run: node --test test/xss-lint-fixture.test.js

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run harness under the deployed CSP
        run: node test/harness.mjs

      # FULL tree, deliberately not --omit=dev (§15, DEV-STANDARDS v2.82.0 /
      # tgwab-standards#159). The dev half is the build/test toolchain, so
      # excluding it blinds the gate to it.
      - name: Dependency audit (§15)
        run: npm audit --audit-level=high
