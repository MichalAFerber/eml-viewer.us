name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  harness:
    name: Headless-Chromium harness (real CSP)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Exits non-zero if package-lock.json has drifted from package.json.
      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run harness under the deployed CSP
        run: node test/harness.mjs

      # FULL tree, deliberately not --omit=dev (§15, DEV-STANDARDS v2.82.0 /
      # tgwab-standards#159). The dev half is the build/test toolchain, so
      # excluding it blinds the gate to it.
      - name: Dependency audit (§15)
        run: npm audit --audit-level=high
